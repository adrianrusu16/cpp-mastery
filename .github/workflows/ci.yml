name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    name: Clang 22 / C++26
    runs-on: ubuntu-26.04

    env:
      CC: clang-22
      CXX: clang++-22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake and Ninja
        run: python -m pip install --upgrade "cmake>=3.31,<4" ninja

      - name: Show toolchain versions
        run: |
          cmake --version
          ninja --version
          clang-22 --version
          clang++-22 --version

      - name: Configure strict debug build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCPP_MASTERY_WARNINGS_AS_ERRORS=ON

      - name: Build strict debug configuration
        run: cmake --build build --parallel

      - name: Run strict debug tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCPP_MASTERY_WARNINGS_AS_ERRORS=ON
          -DCPP_MASTERY_ENABLE_SANITIZERS=ON

      - name: Build sanitizer configuration
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer tests
        run: ctest --test-dir build-sanitize --output-on-failure
